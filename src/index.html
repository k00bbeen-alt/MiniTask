<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Disable caching. The glasses browser aggressively caches pages opened via QR
         code and offers no user-facing "force refresh", so a stale build can get stuck
         on-device. These directives force a fresh fetch on every load. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=600, height=600, initial-scale=1.0" />
    <!-- Replace with a brief, game-specific description of what this game is. -->
    <meta name="description" content="빛의 링이 겹치는 순간 선택하는 짧은 타이밍 게임" />
    <!-- Identifies the page as a Meta Display Glasses (MRBD) webapp so the device routes
         D-pad / EMG input to it. Keep content="yes" verbatim. -->
    <meta name="mrbd-web-app-capable" content="yes" />
    <!-- Records the scaffolding skill and its version, so a released game says what built it.
         Stamped by the create skill and re-stamped on every framework update — don't hand-edit
         it, and don't remove it (`npm run validate` checks it). -->
    <meta
      name="generator"
      content="create-webapp-game 1.0.1 (https://github.com/facebook/meta-wearables-webapp)"
    />
    <!-- Localized text is populated from src/i18n/ at boot. data-i18n keys map to en.json;
         see the plugin's docs/localization.md. -->
    <title data-i18n="title">Still Point</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="game-root" data-state="start">
      <canvas id="game-canvas" width="600" height="600" aria-hidden="true"></canvas>
      <div id="hud">
        <section id="start-screen" class="screen">
          <header class="brand"><p class="eyebrow" data-i18n="tagline"></p><h1 data-i18n="title"></h1><p class="intro" data-i18n="intro"></p></header>
          <button id="start" class="action bottom-action" data-i18n="start"></button>
          <p class="footer" data-i18n="controls"></p>
        </section>
        <section id="play-screen" class="screen" hidden>
          <div id="score-hud"><p class="eyebrow" data-i18n="scoreLabel"></p><p id="score"></p></div>
          <p id="ready-brand" class="ready-brand" data-i18n="title" hidden></p>
          <div class="feedback" role="status" aria-live="polite"><h2 id="feedback-title"></h2><p id="feedback-hint"></p></div>
          <p id="play-hint" class="footer" data-i18n="playHint"></p>
        </section>
        <section id="result-screen" class="screen" hidden>
          <div class="result-reason" role="status"><h2 id="reason"></h2><p id="reason-hint"></p></div>
          <div class="result-score"><p data-i18n="finalScore"></p><p id="final-score"></p><p id="best-score"></p></div>
          <button id="restart" class="action bottom-action" data-i18n="restart"></button>
          <p class="footer" id="result-footer" data-i18n="retryHint"></p>
        </section>
        <section id="pause-screen" class="screen" hidden>
          <div class="pause-icon" aria-hidden="true"><i></i><i></i></div>
          <div class="pause-heading"><h2 data-i18n="paused"></h2><p data-i18n="pauseHint"></p></div>
          <button id="resume" class="action resume-action" data-i18n="resume"></button>
          <button id="pause-restart" class="action bottom-action" data-i18n="restart"></button>
          <p class="footer" data-i18n="pauseControls"></p>
        </section>
      </div>
      <p id="boot-error" role="alert" hidden data-i18n="error"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
